<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Portal Login | Vinayak Dental Care</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: var(--surface);
            padding: clamp(32px, 6vw, 48px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-ambient);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .login-card .logo {
            font-size: 1.6rem;
            justify-content: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="../index.html" class="logo">
            <i class="fa-solid fa-tooth"></i>
            <span>Vinayak Dental Care</span>
        </a>
        <h1 class="card-title" style="font-size: 1.35rem; margin-bottom: 6px;">Staff Portal</h1>
        <p style="color: var(--muted); font-size: 0.875rem; margin-bottom: 28px;">
            Enter administrator credentials to access the clinic dashboard.
        </p>

        <div id="loginAlert" class="alert-box alert-error" style="display: none;" role="alert"></div>

        <form id="loginForm" style="text-align: left;" novalidate>
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="admin@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••••••" autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fa-solid fa-lock"></i> Sign In to Dashboard
            </button>
        </form>

        <div style="margin-top: 24px;">
            <a href="../index.html" style="color: var(--teal); font-size: 0.875rem; font-weight: 500;">
                <i class="fa-solid fa-arrow-left"></i> Return to Main Website
            </a>
        </div>
    </div>

    <script>
        // Check active session via /api/auth/me on load
        (async () => {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    window.location.replace('/dashboard.html');
                }
            } catch (e) {
                // Not logged in, stay on login
            }
        })();

        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('loginAlert');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = form.email.value.trim();
            const password = form.password.value;

            if (!email || !password) {
                alertBox.textContent = 'Please enter both email and password.';
                alertBox.style.display = 'flex';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                let data;
                try {
                    data = await res.json();
                } catch (jsonErr) {
                    data = { success: false, message: `Server error (${res.status}). Database or server is currently initializing.` };
                }

                if (res.ok && data.success) {
                    window.location.replace('/dashboard.html');
                } else {
                    alertBox.textContent = data.message || 'Invalid credentials.';
                    alertBox.style.display = 'flex';
                }
            } catch (err) {
                alertBox.textContent = 'Unable to connect to server. Please check your network and try again.';
                alertBox.style.display = 'flex';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
